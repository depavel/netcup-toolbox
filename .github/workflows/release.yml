name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and verify release archive
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prefix="netcup-toolbox-${tag}"
          git archive --format=tar.gz --prefix="${prefix}/" HEAD -o "${prefix}.tar.gz"
          sha256sum "${prefix}.tar.gz" > "${prefix}.tar.gz.sha256"
          sha256sum -c CHECKSUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prefix="netcup-toolbox-${tag}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              "${prefix}.tar.gz" \
              "${prefix}.tar.gz.sha256" \
              CHECKSUMS.txt \
              --title "netcup-toolbox ${tag}" \
              --notes-file CHANGELOG.md || true
          fi
          gh release upload "${tag}" \
            "${prefix}.tar.gz" \
            "${prefix}.tar.gz.sha256" \
            CHECKSUMS.txt --clobber
