name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          for file in tools/*.sh; do
            bash -n "$file"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning tools/*.sh

      - name: Built-in self-tests
        run: |
          bash tools/netcup-ping.sh --self-test
          bash tools/netcup-calc.sh --self-test
          bash tools/netcup-rdns.sh --self-test
          bash tools/netcup-snapshot.sh --self-test

      - name: Help smoke tests
        run: |
          bash tools/netcup-ping.sh --help
          bash tools/netcup-vlan.sh --help
          bash tools/netcup-init.sh --help
          bash tools/netcup-rdns.sh --help
          bash tools/netcup-snapshot.sh --help
          bash tools/netcup-calc.sh --help

      - name: JSON validation
        run: |
          for file in data/*.json; do
            jq empty "$file"
          done

      - name: Data metadata
        run: |
          jq -e '.schemaVersion == 1 and .planCount > 0 and .benchmarkCount > 0' data/meta.json
          jq -e 'length == 5' data/datacenters.json

      - name: Verify release checksums
        run: sha256sum -c CHECKSUMS.txt
